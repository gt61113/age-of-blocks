<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b141b"><style>:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><meta name="claude:viewport-fit-sides" content="cover">
<title>Age of Blocks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Carte isométrique plein cadre, ressources en haut ; un dock (bas sur téléphone, gauche dès 700 px) porte menus, placement et sélection. */
:root{
  --night:#0b141b; --panel:rgba(16,30,40,.9); --panel2:#1c3342; --dock:#12242e; --line:#3a5868;
  --text:#eef4ec; --mute:#a5bac0; --gold:#f2c14e; --bad:#ff8a73; --ok:#9bd972;
  --display:'Pixelify Sans',ui-monospace,'Courier New',monospace;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--text);font-family:var(--body);font-size:14px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:relative;height:100%;overflow:hidden;display:flex;flex-direction:column}
#map{position:relative;flex:1;min-height:0;min-width:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h2,h3,p{margin:0}

#top{position:absolute;top:0;left:0;right:0;padding-block:8px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
#top>*{pointer-events:auto}
#res{max-width:520px;display:flex;justify-content:space-between;gap:4px;background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:6px 8px}
.chip{display:flex;align-items:center;gap:5px;min-width:0}
.chip b{font-family:var(--body);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.chip.locked{opacity:.38}
.cube,.d{display:inline-block;flex:none;background:var(--c);border-radius:2px;box-shadow:inset -3px -3px 0 rgba(0,0,0,.28),inset 2px 2px 0 rgba(255,255,255,.32)}
.cube{width:15px;height:15px}
.d{width:10px;height:10px;box-shadow:inset -2px -2px 0 rgba(0,0,0,.28),inset 1px 1px 0 rgba(255,255,255,.32);vertical-align:-1px;margin-left:2px}
.pop{display:inline-block;flex:none;width:10px;height:15px;border-radius:5px 5px 3px 3px;background:linear-gradient(#f0cfa8 0 38%,var(--gold) 38%)}
#row2{display:flex;gap:6px;align-items:flex-start;pointer-events:none}
#row2>*{pointer-events:auto}
#hint{flex:1;min-width:0;max-width:560px;background:var(--panel);border-left:4px solid var(--gold);border-radius:4px;padding:6px 10px;font-weight:700;font-size:13px;line-height:1.3}
#mini{flex:none;margin-left:auto;width:128px;height:64px;background:#05090d;border:2px solid var(--line);border-radius:6px;image-rendering:pixelated;touch-action:none}
#toast{position:absolute;left:50%;top:40%;transform:translateX(-50%);max-width:min(84%,340px);background:rgba(10,20,28,.94);border:2px solid var(--gold);border-radius:6px;padding:9px 14px;font-weight:700;text-align:center;line-height:1.3;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}

#dock{flex:none;max-height:34%;overflow:auto;background:var(--dock);border-top:2px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
#bar{display:flex;gap:6px}
.sbtn{flex:1 1 auto;min-height:48px;background:var(--panel2);border:2px solid var(--line);border-radius:6px;padding:6px 4px;font-family:var(--display);font-size:14px}
.sbtn.alert{border-color:var(--gold);color:var(--gold)}
#panel,#bmenu{display:flex;flex-direction:column;gap:8px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px}
#dock h2{font-family:var(--display);font-size:17px;font-weight:700;color:var(--gold)}
#dock h3,.grp h3{font-family:var(--display);font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
#panel p{color:var(--mute);font-size:13px;line-height:1.4}
#panel p b{color:var(--text)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.act{background:var(--panel2);border:2px solid var(--line);border-radius:5px;padding:8px 11px;font-weight:800;font-size:13px;min-height:42px}
.act.go{background:var(--gold);border-color:var(--gold);color:#22180a}
.act.on{border-color:var(--gold);color:var(--gold)}
.act.off{opacity:.5}
.act:disabled{opacity:.45;cursor:default}
.act small{display:block;font-weight:700;font-size:11px;color:var(--mute)}
.no{color:var(--bad)}
.bar{height:8px;background:#0a161d;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok)}
#build{display:flex;align-items:flex-start;gap:6px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
#build::-webkit-scrollbar{display:none}
.bb{flex:none;min-width:84px;background:var(--panel2);border:2px solid var(--line);border-radius:6px;padding:4px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:1px}
.bb canvas{width:52px;height:42px}
.bb .bn{font-family:var(--display);font-size:13px;line-height:1.1}
.bb .bc{font-size:11px;font-weight:700;color:var(--mute);line-height:1.5;text-align:center;white-space:nowrap;padding-inline:4px}
.bb.cur{border-color:var(--gold)}

#modal{position:absolute;inset:0;z-index:4;background:rgba(6,14,20,.72);display:flex;align-items:center;justify-content:center;padding:16px}
#sheet{width:min(100%,380px);max-height:100%;overflow:auto;background:#14262f;border:2px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
#sheet h1{margin:0;font-family:var(--display);font-size:24px;color:var(--gold);text-wrap:balance}
#sheet p{line-height:1.45}

#home{position:absolute;inset:0;z-index:5;background:#16213f;overflow:hidden}
#homebg{position:absolute;inset:0;width:100%;height:100%;display:block}
#homein{position:absolute;inset:0;overflow:auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:14px}
#logo{width:min(100%,440px);flex:none}
#logo svg{display:block;width:100%;height:auto;border-radius:14px;box-shadow:0 6px 0 rgba(7,11,24,.45)}
#card{width:min(100%,440px);background:rgba(14,26,36,.92);border:2px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px}
.grp{display:flex;flex-direction:column;gap:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .act{flex:1 1 0;min-width:72px;text-align:center}
#card>.big:last-child{position:sticky;bottom:0;box-shadow:0 0 0 6px rgba(14,26,36,.96)}
.sw{width:42px;height:42px;border-radius:6px;border:3px solid transparent;background:var(--c);box-shadow:inset -5px -5px 0 rgba(0,0,0,.25),inset 4px 4px 0 rgba(255,255,255,.28)}
.sw.on{border-color:#fff}
.cap{color:var(--mute);font-size:12.5px;line-height:1.35}
.big{min-height:50px;font-size:15px}
.act.x5{flex:0 0 auto;min-width:56px}
.code{font-family:var(--display);font-size:46px;font-weight:700;letter-spacing:.2em;color:var(--gold);text-align:center;padding-block:4px}
#code{width:100%;box-sizing:border-box;font-family:var(--display);font-size:30px;letter-spacing:.3em;text-transform:uppercase;text-align:center;background:var(--panel2);border:2px solid var(--line);border-radius:6px;color:var(--text);padding:8px;-webkit-user-select:text;user-select:text}
#code:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.netmsg{color:var(--mute);font-size:13px;line-height:1.4}
.netmsg:empty{display:none}
.netmsg.bad{color:var(--bad)}

@media (min-width:700px){
  #game{flex-direction:row-reverse}
  #dock{max-height:none;width:clamp(240px,28%,320px);border-top:0;border-right:2px solid var(--line);padding-right:12px}
  #build{flex-wrap:wrap;overflow-x:visible;touch-action:pan-y}
  #bar{flex-direction:column}
  .sbtn{flex:none;font-size:15px}
  #homein{flex-direction:row;justify-content:center;align-items:safe center;gap:24px}
  #logo{width:min(44%,520px)}
  #card{max-height:100%;overflow:auto}
}
</style>

function mqttClient(url,onMsg){const enc=new TextEncoder(),dec=new TextDecoder();let ws;try{ws=new WebSocket(url,['mqtt'])}catch(e){ws=null}
 const cl={url,ok:false,dead:!ws,onopen:null,onclose:null};if(!ws){setTimeout(()=>cl.onclose&&cl.onclose(false),0);return cl}
 ws.binaryType='arraybuffer';let buf=new Uint8Array(0),ping=null;
 const cat=(...ps)=>{let L=0;for(const p of ps)L+=p.length;const o=new Uint8Array(L);let i=0;for(const p of ps){o.set(p,i);i+=p.length}return o};
 const s16=s=>{const b=enc.encode(s);return cat(new Uint8Array([b.length>>8,b.length&255]),b)};
 const pkt=(h,body)=>{const len=[];let n=body.length;do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;len.push(d)}while(n>0);return cat(new Uint8Array([h]),new Uint8Array(len),body)};
 const send=b=>{if(ws.readyState===1){try{ws.send(b)}catch(e){}}};
 ws.onopen=()=>send(pkt(0x10,cat(s16('MQTT'),new Uint8Array([4,2,0,60]),s16('aob'+Math.random().toString(36).slice(2,12)))));
 ws.onmessage=e=>{buf=cat(buf,new Uint8Array(e.data));
  for(;;){if(buf.length<2)return;let mul=1,len=0,i=1,b;do{if(i>=buf.length)return;b=buf[i++];len+=(b&127)*mul;mul*=128}while(b&128);
   if(buf.length<i+len)return;const type=buf[0]>>4,qos=(buf[0]>>1)&3,body=buf.subarray(i,i+len);buf=buf.slice(i+len);
   if(type===2){if(body[1]===0){cl.ok=true;ping=setInterval(()=>send(new Uint8Array([0xC0,0])),25000);if(cl.onopen)cl.onopen()}else{try{ws.close()}catch(x){}}}
   else if(type===3){const tl=(body[0]<<8)|body[1];let p=2+tl;if(qos)p+=2;try{onMsg(dec.decode(body.subarray(2,2+tl)),dec.decode(body.subarray(p)),cl)}catch(x){}}}};
 ws.onclose=()=>{clearInterval(ping);const was=cl.ok;cl.ok=false;cl.dead=true;if(cl.onclose)cl.onclose(was)};ws.onerror=()=>{};
 cl.sub=t=>send(pkt(0x82,cat(new Uint8Array([0,1]),s16(t),new Uint8Array([0]))));
 cl.pub=(t,s)=>{if(cl.ok)send(pkt(0x30,cat(s16(t),enc.encode(s))))};
 cl.close=()=>{cl.onclose=null;send(new Uint8Array([0xE0,0]));try{ws.close()}catch(e){}};
 return cl}

function guestConnect(){if(NET.fake){netSend({k:'hello',color:prefs.color,v:5});return}

 if(a==='n-solo'){NET.solo=true;NET.view=null;$('#modal').hidden=true;toast('La partie continue. Le village adverse reste à l\'arrêt.')}}

/* ---------- caméra et pointeur ---------- */
function clampCam(){cam.x=clamp(cam.x,-N*32,N*32);cam.y=clamp(cam.y,0,N*32)}
function zoomAt(px,py,f){const r=cv.getBoundingClientRect(),z=clamp(cam.z*f,.2,3.2),ox=px-r.width/2,oy=py-r.height/2;cam.x+=ox/cam.z-ox/z;cam.y+=oy/cam.z-oy/z;cam.z=z;lastZoom=performance.now();clampCam()}
const pts=new Map();let tap=null,pinch=0;
const local=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{if(!playing)return;cv.setPointerCapture(e.pointerId);
 if(e.pointerType==='mouse'&&(e.button===2||e.shiftKey)&&!place){const[x,y]=local(e);rectSel={x0:x,y0:y,x1:x,y1:y,id:e.pointerId};return}pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pts.size===1)tap={x:e.clientX,y:e.clientY,ok:true};else{tap=null;const[a,b]=[...pts.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y)}});
cv.addEventListener('pointermove',e=>{if(!playing)return;if(rectSel&&rectSel.id===e.pointerId){const[x,y]=local(e);rectSel.x1=x;rectSel.y1=y;return}const p=pts.get(e.pointerId);
 if(!p){if(place&&!place.pin&&e.pointerType==='mouse'){const[x,y]=local(e);setGhost(x,y)}return}
 const dx=e.clientX-p.x,dy=e.clientY-p.y;
 if(pts.size===1){if(tap&&tap.ok&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)<9)return;if(tap&&tap.ok){tap.ok=false;p.x=e.clientX;p.y=e.clientY;return}
  if(place&&e.pointerType!=='mouse'){const[x,y]=local(e);setGhost(x,y-28);place.pin=true}else{cam.x-=dx/cam.z;cam.y-=dy/cam.z;clampCam()}p.x=e.clientX;p.y=e.clientY}
 else if(pts.size===2){p.x=e.clientX;p.y=e.clientY;const[a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y),r=cv.getBoundingClientRect();cam.x-=dx/2/cam.z;cam.y-=dy/2/cam.z;if(pinch>0&&d>0)zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,d/pinch);pinch=d}});
const up=e=>{if(rectSel&&rectSel.id===e.pointerId){const r=cv.getBoundingClientRect(),x0=Math.min(rectSel.x0,rectSel.x1),x1=Math.max(rectSel.x0,rectSel.x1),y0=Math.min(rectSel.y0,rectSel.y1),y1=Math.max(rectSel.y0,rectSel.y1);rectSel=null;
  if(x1-x0>6||y1-y0>6){const ids=st.un.filter(u=>{if(u.type==='golem'||u.o!==me)return false;const sx=((u.x-u.y)*32-cam.x)*cam.z+r.width/2,sy=((u.x+u.y)*16-cam.y-13)*cam.z+r.height/2;return sx>=x0&&sx<=x1&&sy>=y0&&sy<=y1}).map(u=>u.id);if(ids.length){sel={k:'u',ids};menu=null}else if(sel&&sel.k==='u')sel=null;panelSig='';updateUI()}return}
 if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);if(tap&&tap.ok&&e.type==='pointerup'&&pts.size===0&&playing){const[x,y]=local(e);onTap(x,y);updateUI()}if(pts.size===0)tap=null;pinch=0};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();if(!playing)return;const[x,y]=local(e);zoomAt(x,y,e.deltaY<0?1.15:1/1.15)},{passive:false});
function resize(){DPR=Math.min(window.devicePixelRatio||1,3);const r=cv.getBoundingClientRect();W=cv.width=Math.max(1,Math.round(r.width*DPR));H=cv.height=Math.max(1,Math.round(r.height*DPR));if(!$('#home').hidden)drawHome()}
window.addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe(cv);

/* ---------- sauvegarde et boucle ---------- */
function save(){if(!st||NET.role==='guest')return;try{if(st.mp){if(st.over)localStorage.removeItem(SAVE_DUO);else localStorage.setItem(SAVE_DUO,JSON.stringify(st))}else if(!st.over)localStorage.setItem(SAVE,JSON.stringify(st))}catch(e){}}
let last=0,uiT=0,svT=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;netTick(now);
 if(playing&&st){
  if(NET.role==='guest')guestTick(dt);
  else if(st.mp){if((NET.ready||NET.solo)&&!st.over)step(dt)}else if($('#modal').hidden||ME().won){for(let i=0;i<gspeed;i++)step(dt)}
  if(st&&NET.role==='host'&&NET.ready){NET.snapT+=dt;if(NET.snapT>=(NET.via==='relay'?.25:.15)){NET.snapT=0;netSend(snapFor())}}
  if(st&&playing){PL=ME();render(now);uiT+=dt;if(uiT>.2){uiT=0;updateUI()}miniT+=dt;if(miniT>.5){miniT=0;drawMini()}svT+=dt;if(svT>15){svT=0;save()}}}
 requestAnimationFrame(frame)}
function start(data){buildUI();const s=data&&data.state;if(validSave(s)&&!s.mp){st=s;N=st.N;alloc();me=0;PL=ME()}
 document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
 try{window.claude?.hot?.snapshot?.(()=>({state:st&&!st.mp?st:null}))}catch(e){}
 window.__aob={mkUnit,mkAnimal,trainUnit,attackOrder,moveUnits,tryGen,BIOMES,setN(n){N=n;alloc()},get st(){return st},step,cam,onTap,act,get N(){return N},get VIS(){return VIS},computeVis,
  netRecv:netMsg,NET,cmd,exec,onDrop,get me(){return me},snapFor,play,get SND(){return SND},setPL(o){PL=st.p[o]}};
 showHome();requestAnimationFrame(frame)}
if(window.claude?.hot?.ready)window.claude.hot.ready(start);else start(window.claude?.hot?.data??{});
})();
</script>
